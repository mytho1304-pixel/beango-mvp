<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeanGo MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;font-family:Arial;color:#28231f}.app{max-width:440px;margin:auto;min-height:100vh;background:#faf9f7;padding-bottom:72px}.head{padding:18px;background:white;position:sticky;top:0;z-index:4;border-bottom:1px solid #eee}.brand{font-size:24px;font-weight:800;color:#7b3f16}.search,input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:7px 0}.promo{margin:14px;padding:17px;border-radius:16px;background:#4a2b1c;color:white}.cats{display:flex;overflow:auto;gap:7px;padding:0 14px 12px}.chip,.opt,.slot{border:1px solid #ddd;background:white;border-radius:10px;padding:9px;cursor:pointer}.chip.on,.opt.on,.slot.on{background:#402719;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 14px}.card{background:white;border:1px solid #eee;border-radius:15px;overflow:hidden;position:relative}.card img{width:100%;height:115px;object-fit:cover}.pad{padding:10px}.name{font-weight:800;font-size:14px}.small{font-size:11px;color:#777}.price{font-weight:800;color:#8c471f}.plus{float:right;border:0;background:#402719;color:white;border-radius:50%;width:28px;height:28px}.sold{position:absolute;top:7px;left:7px;background:#222d;color:white;padding:5px;border-radius:7px;font-size:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);height:65px;background:white;border-top:1px solid #ddd;display:flex;z-index:10}.nav button{flex:1;border:0;background:none}.nav button.on{font-weight:800;color:#8c471f}.badge{background:#b43d28;color:white;border-radius:20px;padding:2px 5px;font-size:10px}.page{display:none}.page.on{display:block}.title{font-size:22px;font-weight:800;padding:18px 14px}.box,.item{background:white;margin:0 14px 11px;border:1px solid #eee;border-radius:15px;padding:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0}.total{border-top:1px solid #ddd;margin-top:6px;padding-top:11px;font-weight:800}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#402719;color:white;font-weight:800;margin-top:9px}.alt{background:#f2e9df;color:#60381f}.warn{background:#fff7df;color:#8b4b00;border:1px solid #edc46a}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{background:white;width:min(440px,100%);max-height:92vh;overflow:auto;padding:19px;border-radius:20px 20px 0 0}.close{float:right;border:0;border-radius:50%;width:30px;height:30px}.opts{display:flex;gap:7px;flex-wrap:wrap}.label{font-size:13px;font-weight:800;display:block;margin-top:13px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:175px;overflow:auto}.slot{font-size:11px;text-align:center}.full{opacity:.35;text-decoration:line-through}.notice{background:#fff4d7;padding:10px;border-radius:9px;font-size:12px;margin:9px 0}.track div{padding:8px 0 8px 25px;color:#aaa}.track div:before{content:"○";position:absolute;margin-left:-23px}.track .done{color:#333}.track .done:before{content:"✓";color:green}.track .cur{color:#a44e12;font-weight:800}.track .cur:before{content:"●";color:#a44e12}.tag{background:#fff0c7;color:#92500d;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:800}.empty{text-align:center;padding:60px 25px;color:#777}.qr{width:105px;height:105px;margin:10px auto;background:repeating-linear-gradient(45deg,#111 0 5px,#fff 5px 10px);border:9px solid white;box-shadow:0 0 0 1px #ddd}.toast{display:none;position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:9px 13px;border-radius:9px;z-index:50}.toast.on{display:block}
</style></head><body><div class="app">
<section id="menu" class="page on"><div class="head"><div class="brand">☕ BeanGo</div><div class="small">Order ahead. Enjoy more.</div><input id="search" class="search" placeholder="Search products..."></div><div class="promo"><b>Good morning ☀️</b><br><span class="small" style="color:#eee">Fresh drinks & bites, ready when you are.</span></div><div id="cats" class="cats"></div><div id="grid" class="grid"></div></section>
<section id="cart" class="page"><div class="title">Your Cart</div><div id="cartBody"></div></section>
<section id="orders" class="page"><div class="title">Order Tracking</div><div id="ordersBody"></div></section>
<section id="detail" class="page"><div class="title"><button onclick="go('orders')" style="border:0;background:none;font-size:20px">←</button> Order Details <span id="oid" style="float:right;color:#9b4d17"></span></div><div id="detailBody"></div></section>
<nav class="nav" id="nav"><button id="nmenu" class="on" onclick="go('menu')">☕<br>Menu</button><button id="ncart" onclick="go('cart')">🛒 <span id="badge" class="badge">0</span><br>Cart</button><button id="norders" onclick="go('orders')">📦<br>Order Tracking</button></nav></div>
<div id="productM" class="modal"><div class="sheet"><button class="close" onclick="closeM('productM')">×</button><div id="productS"></div></div></div>
<div id="checkoutM" class="modal"><div class="sheet"><button class="close" onclick="closeM('checkoutM')">×</button><div id="checkoutS"></div></div></div>
<div id="changeM" class="modal"><div class="sheet"><button class="close" onclick="closeM('changeM')">×</button><div id="changeS"></div></div></div>
<div id="payM" class="modal"><div class="sheet"><button class="close" onclick="closeM('payM')">×</button><div id="payS"></div></div></div><div id="toast" class="toast"></div>
<script>
const data={"Coffee":["Americano","Caffè Latte","Cappuccino","Mocha","Espresso","Cold Brew","Caramel Macchiato","Flat White","Vietnamese Coffee","Coconut Coffee"],"Juice":["Orange Juice","Apple Juice","Watermelon Juice","Mango Juice","Pineapple Juice","Guava Juice","Passion Fruit Juice","Carrot Juice","Mixed Berry Juice","Lemon Juice"],"Boba Tea":["Brown Sugar Boba","Classic Milk Tea","Taro Milk Tea","Matcha Boba","Thai Milk Tea","Oolong Milk Tea","Strawberry Boba","Mango Boba","Chocolate Milk Tea","Jasmine Milk Tea"],"Ice Cream":["Vanilla Scoop","Chocolate Scoop","Strawberry Scoop","Matcha Scoop","Mango Sorbet","Cookies & Cream","Salted Caramel","Pistachio Scoop","Berry Sundae","Chocolate Sundae"],"Snacks":["French Fries","Croissant","Chocolate Cookie","Cheesecake","Tiramisu","Chicken Sandwich","Ham & Cheese Toast","Onion Rings","Banana Bread","Brownie"]};
const ico={"Coffee":"☕","Juice":"🍹","Boba Tea":"🧋","Ice Cream":"🍨","Snacks":"🍟"};let ps=[],z=1;for(const[c,a]of Object.entries(data))a.forEach((n,i)=>ps.push({id:z++,c,n,p:(c==="Snacks"?35000:c==="Coffee"?48000:52000)+i*3000,sold:i===8&&(c==="Coffee"||c==="Boba Tea"),img:`https://loremflickr.com/360/260/${encodeURIComponent(n+",food")}?lock=${z}`}));let cat="Coffee",cart=[],orders=[],sel,custom={},cur=null,co={};
const V=n=>n.toLocaleString("vi-VN")+" ₫";function T(s){let e=document.getElementById("toast");e.textContent=s;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}function openM(x){document.getElementById(x).classList.add("on")}function closeM(x){document.getElementById(x).classList.remove("on")}
function go(x){document.querySelectorAll(".page").forEach(e=>e.classList.remove("on"));document.getElementById(x).classList.add("on");document.querySelectorAll(".nav button").forEach(e=>e.classList.remove("on"));let n=document.getElementById("n"+x);if(n)n.classList.add("on");document.getElementById("nav").style.display=x==="detail"?"none":"flex";if(x==="cart")Rcart();if(x==="orders")Rorders()}
function Rcats(){cats.innerHTML=Object.keys(data).map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';Rcats();Rps()">${ico[c]} ${c}</button>`).join("")}function Rps(){let q=search.value.toLowerCase(),a=ps.filter(x=>x.c===cat&&x.n.toLowerCase().includes(q));grid.innerHTML=a.length?a.map(x=>`<div class="card">${x.sold?'<span class="sold">Sold Out</span>':''}<img src="${x.img}" onerror="this.src='https://placehold.co/360x260?text=Food'"><div class="pad"><div class="name">${x.n}</div><div class="small">Freshly prepared</div><span class="price">${V(x.p)}</span><button class="plus" ${x.sold?'disabled':''} onclick="product(${x.id})">+</button></div></div>`).join(""):`<div class="empty">No products found.</div>`}search.oninput=Rps;
function product(id){sel=ps.find(x=>x.id===id);custom={size:"Small",sugar:"50%",ice:"Normal Ice",qty:1};Rp();openM("productM")}function pick(k,a){return `<div class="opts">${a.map(v=>`<span class="opt ${custom[k]===v?'on':''}" onclick="custom.${k}='${v}';Rp()">${v}</span>`).join("")}</div>`}function Rp(){let d=!["Snacks","Ice Cream"].includes(sel.c);productS.innerHTML=`<img src="${sel.img}" style="width:100%;height:180px;object-fit:cover;border-radius:14px"><h2>${sel.n}</h2><b>${${V(sel.p+(custom.size==="Medium"?10000:custom.size==="Large"?15000:0))}}</b>${d?'<label class="label">Size</label>'+pick("size",["Small","Medium","Large"])+'<label class="label">Sugar</label>'+pick("sugar",["0%","50%","100%"])+'<label class="label">Ice</label>'+pick("ice",["No Ice","Less Ice","Normal Ice"]):""}<label class="label">Quantity: ${custom.qty}</label><div class="opts"><span class="opt" onclick="custom.qty=Math.max(1,custom.qty-1);Rp()">−</span><span class="opt" onclick="custom.qty++;Rp()">+</span></div><button class="btn" onclick="add()">Add to Cart</button>`}
function add(){let u=sel.p+(custom.size==="Medium"?10000:custom.size==="Large"?15000:0)),k=sel.id+"-"+custom.size+"-"+custom.sugar+"-"+custom.ice,e=cart.find(x=>x.k===k);e?e.q+=custom.qty:cart.push({k,p:sel,q:custom.qty,u,size:custom.size,sugar:custom.sugar,ice:custom.ice});badge.textContent=cart.reduce((s,x)=>s+x.q,0);closeM("productM");T("Added to cart ✓")}function sum(){return cart.reduce((s,x)=>s+x.u*x.q,0)}
function Rcart(){if(!cart.length){cartBody.innerHTML='<div class="empty">🛒<h3>Your cart is empty</h3><button class="btn" onclick="go(\'menu\')">Browse Menu</button></div>';return}cartBody.innerHTML=cart.map((x,i)=>`<div class="item"><b>${x.p.n}</b><div class="small">${x.p.c==="Snacks"?"":x.size+" • "+x.sugar+" sugar • "+x.ice}</div><div class="row"><span><button onclick="qty(${i},-1)">−</button> ${x.q} <button onclick="qty(${i},1)">+</button></span><b>${V(x.u*x.q)}</b></div><span class="small" style="color:#b43d28" onclick="cart.splice(${i},1);badge.textContent=cart.reduce((s,x)=>s+x.q,0);Rcart()">Remove</span></div>`).join("")+`<div class="box"><div class="row total"><span>Total</span><span>${V(sum())}</span></div><button class="btn" onclick="checkout()">Proceed to Checkout</button><button class="btn alt" onclick="go('menu')">Continue Shopping</button></div>`}function qty(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);badge.textContent=cart.reduce((s,x)=>s+x.q,0);Rcart()}
function slots(){let a=[];for(let h=6;h<=22;h++)for(let m of[0,15,30,45])a.push({t:new Date(2000,0,1,h,m).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),full:(h*4+m/15)%13===0});return a}function checkout(){co={method:"Pickup",time:"",pay:"Cash at Store",name:"",phone:"",address:""};Rc();openM("checkoutM")}function Rc(){let d=co.method==="Delivery";checkoutS.innerHTML=`<h2>Checkout</h2><label class="label">Fulfillment Method</label><div class="opts"><span class="opt ${!d?'on':''}" onclick="co.method='Pickup';co.pay='Cash at Store';Rc()">🏪 Pickup</span><span class="opt ${d?'on':''}" onclick="co.method='Delivery';co.pay='Online Payment';Rc()">🛵 Delivery</span></div>${d?`<label class="label">Recipient Name</label><input oninput="co.name=this.value"><label class="label">Phone</label><input oninput="co.phone=this.value"><label class="label">Delivery Address</label><textarea oninput="co.address=this.value"></textarea><div class="notice">Estimated delivery 30–45 min • Fee ${V(20000)}</div>`:`<label class="label">Pickup Time</label><div class="small">6:00 AM–11:00 PM • every 15 min • last pickup 10:45 PM</div><div class="slots">${slots().map(s=>`<span class="slot ${s.full?'full':''} ${co.time===s.t?'on':''}" ${s.full?'':`onclick="co.time='${s.t}';Rc()"`}>${s.t}${s.full?"<br>Full":""}</span>`).join("")}</div>`}<label class="label">Payment</label><div class="opts">${d?"":`<span class="opt ${co.pay==='Cash at Store'?'on':''}" onclick="co.pay='Cash at Store';Rc()">Cash at Store</span>`}<span class="opt ${co.pay==='Online Payment'?'on':''}" onclick="co.pay='Online Payment';Rc()">Online Payment</span></div>${d?'<div class="notice">Online payment is mandatory for Delivery.</div>':""}<div class="row total"><span>Total</span><span>${V(sum()+(d?20000:0))}</span></div><button class="btn" onclick="review()">Review Order</button>`}
function review(){if(co.method==="Pickup"&&!co.time)return T("Please select a pickup time.");if(co.method==="Delivery"&&(!co.name||!co.phone||!co.address))return T("Please complete delivery information.");let d=co.method==="Delivery";checkoutS.innerHTML=`<h2>Review Order</h2>${cart.map(x=>`<div class="row"><span>${x.q}× ${x.p.n}</span><b>${V(x.q*x.u)}</b></div>`).join("")}<hr><div class="row"><span>Fulfillment</span><b>${co.method}</b></div>${d?`<div class="row"><span>Address</span><b>${co.address}</b></div><div class="row"><span>Delivery fee</span><b>${V(20000)}</b></div>`:`<div class="row"><span>Pickup</span><b>${co.time}</b></div>`}<div class="row"><span>Payment</span><b>${co.pay}</b></div><div class="row total"><span>Total</span><b>${V(sum()+(d?20000:0))}</b></div><button class="btn" onclick="${co.pay==='Online Payment'?'payNew()':'place(false)'}">${co.pay==='Online Payment'?'Pay & Place Order':'Place Order'}</button><button class="btn alt" onclick="Rc()">Back</button>`}
function payNew(){payS.innerHTML=`<h2>Online Payment</h2><div class="qr"></div><div class="row"><span>Demo Bank</span><b>0123456789</b></div><div class="row"><span>Amount</span><b>${V(sum()+(co.method==="Delivery"?20000:0))}</b></div><button class="btn" onclick="closeM('payM');place(true)">Simulate Payment Success</button>`;openM("payM")}function place(paid){let id="BG"+Math.floor(1000+Math.random()*9000);orders.unshift({id,items:JSON.parse(JSON.stringify(cart)),method:co.method,time:co.time,address:co.address,name:co.name,phone:co.phone,pay:co.pay,paid:paid,total:sum()+(co.method==="Delivery"?20000:0),st:0});cart=[];badge.textContent=0;closeM("checkoutM");T("Order confirmed #"+id);go("orders")}
function states(o){return o.method==="Pickup"?["Order Received","Preparing","Ready for Pickup","Completed"]:["Order Received","Preparing","Ready for Delivery","Waiting for Driver","Out for Delivery","Delivered"]}function Rorders(){ordersBody.innerHTML=orders.length?orders.map(o=>`<div class="box" onclick="openOrder('${o.id}')"><div class="row"><b>#${o.id}</b><span class="tag">${o.method==="Pickup"?"🏪 Pickup Order":"🛵 Delivery Order"}</span></div><div class="row"><b>${V(o.total)}</b><span>${states(o)[o.st]}</span></div></div>`).join(""):'<div class="empty">📦<h3>No active orders</h3></div>'}
function openOrder(id){cur=id;Rd();go("detail")}function Rd(){let o=orders.find(x=>x.id===cur),ss=states(o);oid.textContent="#"+o.id;detailBody.innerHTML=`<div class="box"><div class="row"><b>Order Status</b><span class="tag">${o.method==="Pickup"?"🏪 Pickup Order":"🛵 Delivery Order"}</span></div><div class="track">${ss.map((s,i)=>`<div class="${i<o.st?'done':i===o.st?'cur':''}">${s}</div>`).join("")}</div><div class="notice">For demo evaluation purposes only</div><button class="btn warn" onclick="next()">▶ Demo: Next Status</button>${o.method==="Pickup"&&o.st<=2?'<button class="btn alt" onclick="change()">🛵 Change to Delivery</button>':""}</div><div class="box"><h3>Items</h3>${o.items.map(x=>`<div class="row"><span>${x.q}× ${x.p.n}</span><b>${V(x.q*x.u)}</b></div>`).join("")}<div class="row"><span>Payment</span><b>${o.pay} • ${o.paid?"Paid":"Unpaid"}</b></div><div class="row total"><span>Total</span><b>${V(o.total)}</b></div></div>`}function next(){let o=orders.find(x=>x.id===cur);if(o.st<states(o).length-1)o.st++;Rd()}
function change(){let o=orders.find(x=>x.id===cur);changeS.innerHTML=`<h2>Can't make it to the store?</h2><p>Change this Pickup Order to Delivery.</p><input id="cn" placeholder="Recipient name"><input id="cp" placeholder="Phone number"><textarea id="ca" placeholder="Delivery address"></textarea><div class="notice">${o.paid?"Order already paid. Only delivery fee is due.":"Please pay in advance for delivery, or pick up your order at the store."}</div><button class="btn" onclick="changePay()">Continue</button><button class="btn alt" onclick="closeM('changeM')">Keep Pickup</button>`;openM("changeM")}function changePay(){if(!cn.value||!cp.value||!ca.value)return T("Please complete delivery information.");let o=orders.find(x=>x.id===cur);o.pending={name:cn.value,phone:cp.value,address:ca.value};let due=o.paid?20000:o.total+20000;payS.innerHTML=`<h2>Advance Payment Required</h2><p>Please pay in advance for delivery, or pick up your order at the store.</p><div class="qr"></div><div class="row"><span>Amount due</span><b>${V(due)}</b></div><button class="btn" onclick="convert()">Simulate Payment Success</button><button class="btn alt" onclick="closeM('payM')">Keep Pickup</button>`;openM("payM")}function convert(){let o=orders.find(x=>x.id===cur),old=states(o)[o.st];o.method="Delivery";o.address=o.pending.address;o.name=o.pending.name;o.phone=o.pending.phone;o.pay="Online Payment";o.paid=true;o.total+=20000;o.st=old==="Order Received"?0:old==="Preparing"?1:2;delete o.pending;closeM("payM");closeM("changeM");T("Changed to Delivery ✓");Rd()}
Rcats();Rps();
</script></body></html>
